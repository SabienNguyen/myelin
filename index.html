<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myelin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101116'/%3E%3Cpath d='M16 8.6c-2.2-1.4-4.9-1.8-8.2-1.4v14.6c3.3-.4 6 0 8.2 1.4 2.2-1.4 4.9-1.8 8.2-1.4V7.2c-3.3-.4-6 0-8.2 1.4z' fill='none' stroke='%2393b4f7' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 8.6v14.6' stroke='%2393b4f7' stroke-width='2'/%3E%3C/svg%3E" />
    <meta name="description" content="Myelin — a personal tutor over your knowledge vault" />
    <!-- Pre-paint copy of resolveScheme (src/client/lib/theme.ts): without it a saved light choice
         flashed the dark default while the bundle loaded. -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('myelin.theme'); } catch (e) { /* storage unavailable: follow the OS */ }
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
