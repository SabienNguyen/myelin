name: ci

# The harness's unit suite spawns the REAL loreweaver MCP server (tests/mcp.test.ts and friends
# resolve it at ~/Dev/personal/loreweaver), and the e2e backend does the same — so CI needs a
# checkout of SabienNguyen/loreweaver next to this repo. The checkout is ATTEMPTED on every run:
# with loreweaver public it succeeds on the default GITHUB_TOKEN (forks included, no setup); if
# it is private, a fine-grained PAT with read (contents) access saved as the repository secret
# LOREWEAVER_CI_TOKEN authorises it instead.
#
# When the checkout cannot succeed (private repo, no secret) the dependent suites are skipped
# with a visible notice rather than failing — a red X that means "not configured" would teach
# everyone to ignore red X's.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out loreweaver beside the harness
        id: gate
        continue-on-error: true
        # Bounded: while loreweaver is private this attempt FAILS by design (~40s of retries,
        # measured on run 86) — a network flake must not let those retries spin the job out.
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          repository: SabienNguyen/loreweaver
          token: ${{ secrets.LOREWEAVER_CI_TOKEN || github.token }}
          path: loreweaver

      - name: Report a skipped loreweaver checkout
        if: steps.gate.outcome != 'success'
        run: |
          echo "::warning::Could not check out SabienNguyen/loreweaver — skipping the suites that spawn it. A public loreweaver needs no setup; a private one needs a fine-grained PAT with read access saved as LOREWEAVER_CI_TOKEN."

      # The suites resolve both repos through ~/Dev/personal (see tests/mcp.test.ts and
      # tests/e2e/*.config.json) — mirror that layout with symlinks.
      - name: Lay out ~/Dev/personal
        if: steps.gate.outcome == 'success'
        run: |
          mkdir -p "$HOME/Dev/personal"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/Dev/personal/loreweaver-harness"
          ln -sfn "$GITHUB_WORKSPACE/loreweaver" "$HOME/Dev/personal/loreweaver"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install harness dependencies
        run: npm ci

      # Needs no second checkout, so it runs even without the secret — vite builds transpile
      # without checking types, so this is the only place client types are enforced.
      - name: Typecheck
        run: npm run typecheck

      # The client component suite is fully self-contained (jsdom, no loreweaver spawn), so it
      # also runs ungated — real test coverage on every push even before the secret exists.
      - name: Client component suite
        run: npx vitest run tests/client

      - name: Install loreweaver dependencies
        if: steps.gate.outcome == 'success'
        run: npm ci
        working-directory: loreweaver

      - name: Unit and integration suite
        if: steps.gate.outcome == 'success'
        run: npx vitest run

      - name: Install Playwright Chromium
        if: steps.gate.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        if: steps.gate.outcome == 'success'
        run: npx playwright test
