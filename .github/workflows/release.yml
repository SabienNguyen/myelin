name: release

# Cut a release by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Each OS runner builds its own installer with electron-builder and uploads it to the GitHub
# Release for the tag: an AppImage (Linux), a dmg (macOS), and an NSIS .exe (Windows). The build
# is UNSIGNED — macOS and Windows will warn on first launch until signing/notarization is set up.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # electron-builder bundles the Engram core into the app (scripts/bundle-engram.mjs), so the
      # core has to be present. Checked out INSIDE the workspace; ENGRAM_REPO points the bundler at
      # it. A public engram needs no secret; a private one needs ENGRAM_CI_TOKEN (falls back to the
      # old LOREWEAVER_CI_TOKEN name so an un-renamed secret still works).
      - name: Check out engram beside the harness
        uses: actions/checkout@v4
        with:
          repository: SabienNguyen/engram
          token: ${{ secrets.ENGRAM_CI_TOKEN || secrets.LOREWEAVER_CI_TOKEN || github.token }}
          path: engram

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Export the platform's certificate ONLY when its secret is actually set. An EMPTY CSC_LINK is
      # not the same as an unset one: electron-builder treats a present-but-empty CSC_LINK as "a cert
      # was provided", tries to read it as a file, and dies with "not a file". So write it to the env
      # only when non-empty; with nothing exported and auto-discovery off (below), the build is
      # cleanly unsigned. macOS reads a Developer ID .p12, Windows a .pfx — each job its own secret.
      - name: Prepare code-signing certificate
        shell: bash
        env:
          CERT: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CERT_PWD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "CSC_LINK<<__CSC_EOF__"; echo "$CERT"; echo "__CSC_EOF__"
              echo "CSC_KEY_PASSWORD<<__PWD_EOF__"; echo "$CERT_PWD"; echo "__PWD_EOF__"
            } >> "$GITHUB_ENV"
            echo "signing: certificate configured for ${{ runner.os }}"
          else
            echo "signing: no certificate for ${{ runner.os }} — building unsigned"
          fi

      # build:all + bundle:engram + electron-builder. CSC_LINK/CSC_KEY_PASSWORD arrive from the step
      # above only when a cert secret exists. CSC_IDENTITY_AUTO_DISCOVERY=false stops a keychain
      # search when there's no cert; the APPLE_* trio drives notarization in electron/notarize.mjs
      # (which no-ops when they're empty).
      - name: Build installer
        run: npm run dist
        env:
          ENGRAM_REPO: ${{ github.workspace }}/engram
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          body: |
            Myelin ${{ github.event.inputs.tag || github.ref_name }} — a learn-anything desktop tutor.

            Download the installer for your platform below and run it; nothing else to install and
            no config to write. Builds are **unsigned**, so macOS and Windows will warn on first
            launch (right-click → Open on macOS; "More info → Run anyway" on Windows).
          files: |
            release/*.AppImage
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
