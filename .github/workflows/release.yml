name: release

# Cut a release by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Each OS runner builds its own installer with electron-builder and uploads it to the GitHub
# Release for the tag: an AppImage (Linux), a dmg (macOS), and an NSIS .exe (Windows). The build
# is UNSIGNED — macOS and Windows will warn on first launch until signing/notarization is set up.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # electron-builder bundles the Engram core into the app (scripts/bundle-engram.mjs), so the
      # core has to be present. Checked out INSIDE the workspace; ENGRAM_REPO points the bundler at
      # it. A public engram needs no secret; a private one needs ENGRAM_CI_TOKEN (falls back to the
      # old LOREWEAVER_CI_TOKEN name so an un-renamed secret still works).
      - name: Check out engram beside the harness
        uses: actions/checkout@v4
        with:
          repository: SabienNguyen/engram
          token: ${{ secrets.ENGRAM_CI_TOKEN || secrets.LOREWEAVER_CI_TOKEN || github.token }}
          path: engram

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build:all + bundle:engram + electron-builder.
      #
      # Signing is opt-in via repository secrets and OFF by default — with none set, every var below
      # is empty and electron-builder produces the same unsigned installers as before (see
      # docs/SIGNING.md for what to add). CSC_LINK carries the platform's certificate: on the macOS
      # runner a Developer ID .p12, on the Windows runner a code-signing .pfx — each job reads its own
      # secret. CSC_IDENTITY_AUTO_DISCOVERY=false stops a keychain search when no cert is provided; an
      # explicit CSC_LINK still signs. The APPLE_* trio drives notarization in electron/notarize.mjs.
      - name: Build installer
        run: npm run dist
        env:
          ENGRAM_REPO: ${{ github.workspace }}/engram
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          body: |
            Myelin ${{ github.event.inputs.tag || github.ref_name }} — a learn-anything desktop tutor.

            Download the installer for your platform below and run it; nothing else to install and
            no config to write. Builds are **unsigned**, so macOS and Windows will warn on first
            launch (right-click → Open on macOS; "More info → Run anyway" on Windows).
          files: |
            release/*.AppImage
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
